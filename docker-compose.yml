services:
  db:
    image: postgres:16
    # Las credenciales salen del .env, que no se commitea. Los defaults son
    # solo para que un clon nuevo levante; en produccion se definen en el .env.
    # Postgres solo las aplica al crear el volumen: si cambias la password con
    # la base ya creada, hay que hacer ALTER USER (ver .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mystoreexe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mystoreexe}
      POSTGRES_DB: ${POSTGRES_DB:-mystoreexe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Sin healthcheck el backend arranca antes de que Postgres acepte
    # conexiones y las migraciones fallan en el primer intento.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mystoreexe} -d ${POSTGRES_DB:-mystoreexe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Las variables del .env (SEED_*, etc) entran al contenedor. Lo de
    # "environment" pisa al env_file: dentro de la red de compose la base
    # es "db", no "localhost".
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mystoreexe}:${POSTGRES_PASSWORD:-mystoreexe}@db:5432/${POSTGRES_DB:-mystoreexe}
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./db:/db
      - ./alembic.ini:/alembic.ini
    # Aplica las migraciones pendientes antes de levantar la API.
    command: >
      sh -c "alembic -c /alembic.ini upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
